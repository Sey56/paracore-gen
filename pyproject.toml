[project]
name = "paracore-gen"
version = "2.1.1"
description = "Paracore-Gen - the generalist Revit MCP server: generates and runs C# through the Paracore engine."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "grpcio>=1.60",
    "protobuf>=4.25",
    "pydantic>=2.0",
    "pydantic-ai>=0.0.20",
    "fastapi>=0.100",
    "httpx>=0.25",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
]

[tool.ruff]
target-version = "py312"
